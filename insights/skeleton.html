<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 60rem;
        margin: 2rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      header p {
        color: #666;
        margin: 0.25rem 0;
      }
      section {
        margin: 2rem 0;
        padding-top: 1rem;
        border-top: 1px solid #eee;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        margin: 0.5rem 0;
      }
      th,
      td {
        text-align: left;
        padding: 0.4rem 0.6rem;
        border-bottom: 1px solid #eee;
      }
      th {
        background: #fafafa;
      }
      code {
        background: #f4f4f4;
        padding: 0 0.2rem;
        border-radius: 3px;
      }
      details {
        margin: 0.5rem 0;
      }
      summary {
        cursor: pointer;
        color: #555;
      }
      .lede {
        font-size: 1.05rem;
      }
      .meta {
        color: #666;
        font-size: 0.9rem;
      }
      footer {
        margin-top: 3rem;
        padding-top: 1rem;
        border-top: 1px solid #eee;
        color: #666;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <header>
      <p class="meta">Agent activity report</p>
      <h1>{{title}}</h1>
      <p class="meta">
        <time datetime="{{period_start_iso}}">{{period_start_label}}</time>
        to
        <time datetime="{{period_end_iso}}">{{period_end_label}}</time>
        — {{scope_summary}}
      </p>
    </header>

    <main>{{modules}}</main>

    <footer>
      <p>Generated {{generated_at}} from <code>data/parquet/</code>.</p>
      <details>
        <summary>Queries used</summary>
        {{queries_used}}
      </details>
      <details>
        <summary>Data quality notes</summary>
        {{data_quality}}
      </details>
    </footer>
  </body>
</html>
